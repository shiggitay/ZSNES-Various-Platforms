# Builds ZSNES for PS4 (tools/build-ps4.sh) with OpenOrbis's newest release
# and the clang it is built for, keeps the .pkg with the run, and pushes it
# to the ps4-build branch.
name: PS4

on:
  push:
    branches: [main]
    # Any change to the program: the core is in the build as much as ps4/.
    paths-ignore:
      - "builds/**"
      - "**.md"
      - "**.txt"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ps4:
    runs-on: ubuntu-24.04
    env:
      # PkgTool.Core is .NET; it needs no locale data for what it does here.
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-18 lld-18 python3 make
          clang-18 --version | head -1
          # PkgTool.Core is built on an older .NET, which needs OpenSSL 1.1:
          # Ubuntu 20.04's, beside this system's OpenSSL 3.
          curl -fsSL -o /tmp/libssl1.1.deb \
            http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          sudo dpkg -i /tmp/libssl1.1.deb
      # OpenOrbis's newest release, and which LLVM it was built with: the
      # objects, its start files and its library stubs must agree (a mix of
      # LLVMs made a package the PS4 called corrupted).
      - name: OpenOrbis's newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /opt/oo
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases > /tmp/releases.json
          python3 - <<'PY'
          import json
          rel = json.load(open('/tmp/releases.json'))[0]
          print('release', rel['tag_name'])
          for a in rel['assets']:
              print('  asset', a['name'], a['size'])
          PY
          url=$(python3 - <<'PY'
          import json
          rel = json.load(open('/tmp/releases.json'))[0]
          names = [a for a in rel['assets'] if a['name'].endswith(('.tar.gz', '.tgz'))]
          pick = [a for a in names if 'llvm-18' in a['name']] or names
          print(pick[0]['browser_download_url'])
          PY
          )
          echo "OpenOrbis: $url"
          curl -fsSL "$url" | tar -xz -C /opt/oo
          tools=$(find /opt/oo -type d -path '*/bin/linux' | head -1)
          oo=$(dirname "$(dirname "$tools")")
          ls "$oo" "$tools"
          chmod +x "$tools"/* || true
          echo "OO_PS4_TOOLCHAIN=$oo" >> "$GITHUB_ENV"
          echo "$tools" >> "$GITHUB_PATH"
      - name: OpenOrbis's sample files
        run: |
          git clone -q --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/oo
          ls -l /tmp/oo/samples/piglet/sce_sys/about /tmp/oo/samples/piglet/sce_module
      - name: Build
        run: |
          CC_PS4=clang-18 LD_PS4=ld.lld-18 \
          RIGHT_SPRX=/tmp/oo/samples/piglet/sce_sys/about/right.sprx \
          SCE_MODULES=/tmp/oo/samples/piglet/sce_module \
            tools/build-ps4.sh
      # What the PS4's loader has to handle in the program: the relocation
      # kinds, any text relocations, thread-local data, and the segments.
      - name: Inspect ZSNES.elf
        run: |
          llvm-readelf-18 -h -l build-ps4/ZSNES.elf | sed -n '1,60p'
          echo "--- dynamic:"
          llvm-readelf-18 -d build-ps4/ZSNES.elf | head -40
          echo "--- relocation kinds:"
          llvm-readelf-18 -r build-ps4/ZSNES.elf | awk '/R_X86_64/{print $3}' | sort | uniq -c
          echo "--- largest sections:"
          llvm-readelf-18 -S -W build-ps4/ZSNES.elf | awk 'NR>5 && $6 ~ /^[0-9a-f]+$/ {printf "%10d %s\n", strtonum("0x"$6), $2}' | sort -rn | head -12
      - uses: actions/upload-artifact@v4
        with:
          name: zsnes-ps4
          path: build-ps4/zsnes-ps4.pkg
          if-no-files-found: error
      # The .pkg on the ps4-build branch as well, where git can fetch it;
      # [skip ci] keeps the push from starting other builds.
      - name: Push the .pkg to the ps4-build branch
        run: |
          set -eu
          dir=$(mktemp -d)
          cp build-ps4/zsnes-ps4.pkg "$dir/"
          cd "$dir"
          git init -q
          git checkout -q -b ps4-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zsnes-ps4.pkg
          git commit -q -m "zsnes-ps4.pkg from ${GITHUB_SHA} [skip ci]"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ps4-build
        env:
          GH_TOKEN: ${{ github.token }}
