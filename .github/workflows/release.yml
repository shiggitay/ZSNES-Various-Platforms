# Publishes builds/ as a GitHub release: run it from the Actions tab
# ("Release", then "Run workflow"). It creates the tag and the release on the
# commit it runs on, or, if the release exists, moves the tag to the commit,
# updates its text, replaces its files and removes files no longer in builds/.
# The text is builds/RELEASE_NOTES.md; the files are the
# packages in builds/ (*.tar.gz, *.hqx, *.ipa).
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create or update
        required: true
        default: v1.0
      title:
        description: Release title
        required: true
        default: ZSNES PPC 1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          set -eu
          shopt -s nullglob
          assets=(builds/*.tar.gz builds/*.hqx builds/*.ipa)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No packages in builds/" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Move the tag to this commit, so the source archives match.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$TAG" --title "$TITLE" --notes-file builds/RELEASE_NOTES.md
            gh release upload "$TAG" "${assets[@]}" --clobber
            # Drop files no longer in builds/ (renamed or retired packages).
            gh release view "$TAG" --json assets --jq '.assets[].name' |
              while read -r name; do
                [ -f "builds/$name" ] || gh release delete-asset "$TAG" "$name" --yes
              done
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" \
              --notes-file builds/RELEASE_NOTES.md "${assets[@]}"
          fi
          echo "Released $TAG: ${assets[*]}"
