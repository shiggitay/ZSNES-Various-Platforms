# Builds the iOS app (tools/build-ios.sh) on a Mac runner, as an unsigned
# .ipa uploaded with the run (Actions tab > the run > Artifacts).
name: iOS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios.yml"
      - "tools/build-ios.sh"
      - "ios/**"
      - "unix/**"
      - "main.c"
      - "gblhdr.h"
      - "ver.c"
  workflow_dispatch:

jobs:
  ios:
    # Mac runners can sit unclaimed for a while when GitHub is short of
    # them; an Intel and an Apple silicon one are both asked for, and either
    # makes the same .ipa.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: |
          brew untap aws/tap || true
          brew install make pkgconf || true
          cmake --version
          xcodebuild -version
      - name: Build
        run: tools/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zsnes-ios-${{ matrix.runner }}
          path: build-ios/zsnes-ios.ipa
          if-no-files-found: error
