# Builds the iOS app (tools/build-ios.sh) on a Mac runner, as an unsigned
# .ipa uploaded with the run (Actions tab > the run > Artifacts).
name: iOS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios.yml"
      - "tools/build-ios.sh"
      - "ios/**"
      - "unix/**"
      - "main.c"
      - "zpath.c"
      - "mmlib/**"
      - "gblhdr.h"
      - "ver.c"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    # Mac runners can sit unclaimed for a while when GitHub is short of
    # them; an Intel and an Apple silicon one are both asked for, and either
    # makes the same .ipa.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: |
          brew untap aws/tap || true
          brew install make pkgconf || true
          cmake --version
          xcodebuild -version
      - name: Build
        run: tools/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zsnes-ios-${{ matrix.runner }}
          path: build-ios/zsnes-ios.ipa
          if-no-files-found: error
      # The .ipa on the ios-build branch as well, where git can fetch it
      # (the artifact store is not reachable from everywhere). One runner
      # does it; [skip ci] keeps the push from starting other builds.
      - name: Push the .ipa to the ios-build branch
        if: matrix.runner == 'macos-latest'
        run: |
          set -eu
          dir=$(mktemp -d)
          cp build-ios/zsnes-ios.ipa ios/ReadMe.txt "$dir/"
          cd "$dir"
          git init -q -b ios-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zsnes-ios.ipa ReadMe.txt
          git commit -q -m "zsnes-ios.ipa from ${GITHUB_SHA} [skip ci]"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-build
        env:
          GH_TOKEN: ${{ github.token }}
